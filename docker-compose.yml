version: '3.8'

services:
  backend:
    build: .
    command: npm run dev:backend
    ports:
      - "3001:3001"
    environment:
      - BACKEND_PORT=3001
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    restart: unless-stopped

  frontend:
    build: .
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3001
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    restart: unless-stopped
